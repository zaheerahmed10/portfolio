<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Login | Zaheer Ahmed</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #00ff88;
            --primary-dark: #00cc6a;
            --dark-bg: #050505;
            --card-bg: rgba(10, 10, 10, 0.7);
            --glass-border: rgba(0, 255, 136, 0.15);
            --text-gray: #888888;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark-bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        
        /* Animated BG */
        .animated-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 20% 30%, rgba(0,255,136,0.03) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(0,255,136,0.02) 0%, transparent 50%);
        }
        
        .grid-pattern {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background-image: linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        
        #particlesContainer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0.4;
            animation: floatParticle linear infinite;
        }
        
        @keyframes floatParticle {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }
        
        /* Navbar */
        .navbar {
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(20px);
            padding: 15px 0;
            border-bottom: 1px solid var(--glass-border);
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
        }
        
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        
        .brand-circle-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.3);
            background: #0a0a0a;
        }
        
        .brand-text {
            font-size: 1.6rem;
            font-weight: 800;
            color: white;
        }
        .brand-text span { color: var(--primary); }
        
        .nav-link {
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            color: #fff !important;
        }
        .nav-link:hover { color: var(--primary) !important; }
        
        .btn-primary-custom {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            padding: 8px 22px;
            border-radius: 50px;
            font-weight: 600;
            color: var(--dark-bg);
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            font-size: 0.85rem;
        }
        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.4);
            color: var(--dark-bg);
        }
        
        /* Login Section */
        .login-section {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 120px 0 60px;
        }
        
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            transition: all 0.4s ease;
        }
        
        .glass-card:hover {
            border-color: rgba(0, 255, 136, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .form-control-custom {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 12px 18px;
            border-radius: 12px;
            color: white;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        .form-control-custom:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 255, 136, 0.05);
        }
        
        .form-control-custom::placeholder { color: #666; }
        
        .glow-text {
            color: var(--primary);
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }
        
        .social-icon {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
        }
        
        .social-icon:hover {
            background: var(--primary);
            color: var(--dark-bg);
            transform: translateY(-5px);
        }
        
        .floating { animation: float 4s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .form-check-input {
            background-color: transparent;
            border: 1px solid var(--glass-border);
        }
        .form-check-input:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }
        
        .toast-msg {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 14px 28px;
            border-radius: 12px;
            color: white;
            z-index: 1100;
            font-weight: 500;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* Footer */
        footer {
            border-top: 1px solid var(--glass-border);
            padding: 40px 0 30px;
            margin-top: auto;
            background: rgba(5, 5, 5, 0.95);
        }
    </style>
</head>
<body>

<div class="animated-bg"></div>
<div class="grid-pattern"></div>
<div id="particlesContainer"></div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/">
            <img src="" alt="Logo" class="brand-circle-img" onerror="this.src='https://ui-avatars.com/api/?background=0a0a0a&color=00ff88&size=50&rounded=true&bold=true&name=ZA'">
            <span class="brand-text">ZA<span>.</span></span>
        </a>
        <button class="navbar-toggler bg-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto gap-3">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/#about">About</a></li>
                <li class="nav-item"><a class="nav-link" href="/#skills">Skills</a></li>
                <li class="nav-item"><a class="nav-link" href="/#projects">Projects</a></li>
                <li class="nav-item"><a class="nav-link" href="/#contact">Contact</a></li>
                <li class="nav-item"><a class="btn-primary-custom" href="/register">Register</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Login Section -->
<section class="login-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7 col-sm-9 col-11">
                <div class="glass-card">
                    <div class="text-center mb-4">
                        <div class="floating">
                            <i class="fas fa-code fs-1 glow-text mb-2"></i>
                        </div>
                        <h2 class="fw-bold mb-1">Welcome <span class="glow-text">Back</span></h2>
                        <p class="text-white-50 small">Login to your account</p>
                    </div>
                    
                    <form id="loginForm">
                        <div class="mb-3">
                            <input type="email" name="email" class="form-control-custom" placeholder="Email Address" required>
                        </div>
                        <div class="mb-4">
                            <input type="password" name="password" class="form-control-custom" placeholder="Password" required>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label small text-white-50" for="rememberMe">Remember me</label>
                            </div>
                            <a href="#" class="small text-decoration-none" style="color: var(--primary);">Forgot Password?</a>
                        </div>
                        
                        <button type="submit" class="btn-primary-custom w-100 py-2" id="loginBtn">
                            Login <i class="fas fa-arrow-right ms-2"></i>
                        </button>
                        <div id="authMessage" class="mt-3 text-center small"></div>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="text-white-50 small mb-0">
                            Don't have an account? 
                            <a href="/register" style="color: var(--primary); font-weight: 500;">Register here</a>
                        </p>
                    </div>
                    
                    <div class="text-center mt-4">
                        <p class="text-white-50 small mb-3">Or login with</p>
                        <div class="d-flex gap-3 justify-content-center">
                            <a href="#" class="social-icon"><i class="fab fa-google"></i></a>
                            <a href="#" class="social-icon"><i class="fab fa-github"></i></a>
                            <a href="#" class="social-icon"><i class="fab fa-linkedin-in"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="text-center">
    <div class="container">
        <a class="navbar-brand d-inline-block mb-2" href="/" style="font-size: 1.5rem;">
            <img src="" alt="Logo" class="brand-circle-img" style="width: 40px; height: 40px;" onerror="this.src='https://ui-avatars.com/api/?background=0a0a0a&color=00ff88&size=40&rounded=true&bold=true&name=ZA'">
            <span class="brand-text" style="font-size: 1.3rem;">ZA<span>.</span></span>
        </a>
        <p class="text-white-50 small mb-2">— Our Code Builds Your Vision —</p>
        <div class="d-flex gap-3 justify-content-center mb-3">
            <a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-linkedin-in"></i></a>
            <a href="https://github.com/zaheerahmed10" class="social-icon" target="_blank"><i class="fab fa-github"></i></a>
        </div>
        <p class="text-white-50 small mb-0">&copy; 2026 Zaheer Ahmed. All rights reserved.</p>
    </div>
</footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Particles
    (function createParticles() {
        const container = document.getElementById('particlesContainer');
        for (let i = 0; i < 40; i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 20 + 's';
            p.style.animationDuration = 12 + Math.random() * 18 + 's';
            p.style.width = p.style.height = (Math.random() * 3 + 2) + 'px';
            container.appendChild(p);
        }
    })();
    
    const loginForm = document.getElementById('loginForm');
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginForm').email.value.trim();
        const password = document.getElementById('loginForm').password.value;
        const btn = document.getElementById('loginBtn');
        const original = btn.innerHTML;
        
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
        btn.disabled = true;
        
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            
            if (data.success) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                showToast('✅ Login successful! Redirecting...', 'success');
                
                setTimeout(() => {
                    if (data.user.role === 'admin') {
                        window.location.href = '/admin/dashboard';
                    } else {
                        window.location.href = '/';
                    }
                }, 1000);
            } else {
                showToast('❌ ' + (data.message || 'Login failed'), 'error');
                btn.innerHTML = original;
                btn.disabled = false;
            }
        } catch (error) {
            showToast('❌ Network error', 'error');
            btn.innerHTML = original;
            btn.disabled = false;
        }
    });
    
    function showToast(msg, type) {
        const t = document.createElement('div');
        t.className = 'toast-msg';
        t.style.background = type === 'success' ? '#10b981' : '#ef4444';
        t.innerHTML = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }
    
    // Already logged in check
    if (localStorage.getItem('token')) {
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        window.location.href = user.role === 'admin' ? '/admin/dashboard' : '/';
    }
</script>
</body>
</html>
