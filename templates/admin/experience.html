{% extends "admin/_base.html" %}
{% block title %}Experience{% endblock %}
{% block page_title %}Experience{% endblock %}

{% block content %}

<div class="section-head">
    <h2>Manage Experience</h2>
    <button class="btn btn-primary" onclick="openExpModal()">
        <i class="fas fa-plus"></i> Add Experience
    </button>
</div>

<div class="card">
    <div id="expList">
        <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
    </div>
</div>

<div class="modal-overlay" id="expModal">
    <div class="modal">
        <div class="modal-head">
            <h3 id="expModalTitle">Add Experience</h3>
            <button class="modal-close" onclick="closeExpModal()"><i class="fas fa-times"></i></button>
        </div>
        <form onsubmit="return saveExp(event)">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Title *</label>
                    <input type="text" id="eTitle" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Organization</label>
                    <input type="text" id="eOrg" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea id="eDesc" class="form-textarea"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Start Date</label>
                    <input type="text" id="eStart" class="form-input" placeholder="2024">
                </div>
                <div class="form-group">
                    <label class="form-label">End Date</label>
                    <input type="text" id="eEnd" class="form-input" placeholder="2025 or leave blank">
                </div>
                <div class="form-group">
                    <label class="form-label">Display Order</label>
                    <input type="number" id="eOrder" class="form-input" value="0">
                </div>
                <label class="form-check">
                    <input type="checkbox" id="eCurrent"><span>Currently ongoing</span>
                </label>
            </div>
            <div class="modal-foot">
                <button type="button" class="btn btn-ghost" onclick="closeExpModal()">Cancel</button>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
const H = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('token')}` };
let allExp = [];
let editId = null;

async function loadExp() {
    const box = document.getElementById('expList');
    try {
        const res = await fetch('/api/experience', { headers: H });
        const data = await res.json();
        allExp = data.experience || [];
        if (allExp.length === 0) {
            box.innerHTML = '<div class="empty-state"><i class="fas fa-briefcase"></i><p>No experience yet</p></div>';
            return;
        }
        box.innerHTML = allExp.map(e => `
            <div style="padding: 20px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 16px;">
                <div style="flex: 1;">
                    <div style="font-weight: 600; font-size: 1rem;">${esc(e.title)}</div>
                    <div style="color: var(--accent-light); font-size: 0.9rem; margin: 4px 0;">${esc(e.organization || '')}</div>
                    <div style="color: var(--text-muted); font-size: 0.85rem;">${esc(e.description || '')}</div>
                    <div style="color: var(--text-dim); font-size: 0.8rem; margin-top: 6px;">${esc(e.start_date || '')} — ${e.is_current ? 'Present' : esc(e.end_date || '')}</div>
                </div>
                <div class="actions">
                    <button class="btn-icon" onclick="editExp('${e.id}')"><i class="fas fa-pen"></i></button>
                    <button class="btn-icon danger" onclick="delExp('${e.id}')"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        `).join('');
    } catch (err) { box.innerHTML = '<div class="empty-state">Failed to load</div>'; }
}

function esc(t) { const d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; }

function openExpModal() {
    editId = null;
    document.getElementById('expModalTitle').textContent = 'Add Experience';
    ['eTitle','eOrg','eDesc','eStart','eEnd'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('eOrder').value = 0;
    document.getElementById('eCurrent').checked = false;
    document.getElementById('expModal').classList.add('open');
}

function closeExpModal() { document.getElementById('expModal').classList.remove('open'); }

async function saveExp(e) {
    e.preventDefault();
    const payload = {
        title: document.getElementById('eTitle').value,
        organization: document.getElementById('eOrg').value,
        description: document.getElementById('eDesc').value,
        start_date: document.getElementById('eStart').value,
        end_date: document.getElementById('eEnd').value,
        display_order: parseInt(document.getElementById('eOrder').value),
        is_current: document.getElementById('eCurrent').checked
    };
    const url = editId ? `/api/experience/${editId}` : '/api/experience';
    const method = editId ? 'PUT' : 'POST';
    await fetch(url, { method, headers: H, body: JSON.stringify(payload) });
    closeExpModal();
    loadExp();
    return false;
}

window.editExp = function(id) {
    const x = allExp.find(e => e.id === id);
    if (!x) return;
    editId = id;
    document.getElementById('expModalTitle').textContent = 'Edit Experience';
    document.getElementById('eTitle').value = x.title;
    document.getElementById('eOrg').value = x.organization || '';
    document.getElementById('eDesc').value = x.description || '';
    document.getElementById('eStart').value = x.start_date || '';
    document.getElementById('eEnd').value = x.end_date || '';
    document.getElementById('eOrder').value = x.display_order || 0;
    document.getElementById('eCurrent').checked = x.is_current;
    document.getElementById('expModal').classList.add('open');
};

window.delExp = async function(id) {
    if (!confirm('Delete this experience?')) return;
    await fetch(`/api/experience/${id}`, { method: 'DELETE', headers: H });
    loadExp();
};

loadExp();
</script>
{% endblock %}
