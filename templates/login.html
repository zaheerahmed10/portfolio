<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Zaheer Ahmed Chachar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a0a; --bg-elev: #111; --bg-card: #141414;
            --border: rgba(255,255,255,0.08); --text: #fff;
            --text-muted: #a1a1aa; --text-dim: #71717a;
            --accent: #a855f7; --accent-light: #c084fc;
            --accent-glow: rgba(168,85,247,0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px; position: relative; overflow: hidden;
        }
        body::before {
            content: ''; position: absolute;
            top: -200px; left: -200px;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(168,85,247,0.15), transparent 70%);
            filter: blur(80px); pointer-events: none;
        }
        body::after {
            content: ''; position: absolute;
            bottom: -200px; right: -200px;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(168,85,247,0.12), transparent 70%);
            filter: blur(80px); pointer-events: none;
        }
        .login-box {
            width: 100%; max-width: 420px;
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 44px 36px;
            position: relative; z-index: 1;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
        }
        .login-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6rem; font-weight: 700;
            text-align: center; margin-bottom: 8px;
        }
        .login-logo span { color: var(--accent); }
        .login-sub {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-bottom: 32px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .form-group { margin-bottom: 18px; }
        .form-label {
            display: block; font-size: 0.8rem;
            font-weight: 600; color: var(--text-muted);
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%; padding: 13px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px; color: var(--text);
            font-family: inherit; font-size: 0.925rem;
            transition: all 0.2s;
        }
        .form-input:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(168,85,247,0.1);
        }
        .form-input::placeholder { color: var(--text-dim); }
        .form-submit {
            width: 100%; padding: 14px;
            background: var(--accent); color: #fff;
            border: none; border-radius: 10px;
            font-family: inherit; font-size: 0.95rem;
            font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            gap: 8px; transition: all 0.25s;
            margin-top: 8px;
        }
        .form-submit:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px var(--accent-glow);
        }
        .form-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .error-box {
            padding: 12px 16px;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 10px;
            color: #f87171;
            font-size: 0.875rem;
            margin-bottom: 18px;
            display: none;
        }
        .back-link {
            display: block; text-align: center;
            color: var(--text-dim); font-size: 0.85rem;
            text-decoration: none; margin-top: 20px;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent-light); }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-logo">ZA<span>.</span></div>
        <div class="login-sub">Admin Access</div>

        <div class="error-box" id="errorBox"></div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-input" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="form-submit">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('errorBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = form.querySelector('button');
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
            btn.disabled = true;
            errorBox.style.display = 'none';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: form.email.value,
                        password: form.password.value
                    })
                });
                const data = await res.json();

                if (data.success && data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/admin/dashboard';
                } else {
                    errorBox.textContent = data.message || 'Invalid credentials';
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.textContent = 'Connection error. Please try again.';
                errorBox.style.display = 'block';
            } finally {
                btn.innerHTML = original;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
