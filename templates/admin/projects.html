{% extends "admin/_base.html" %}
{% block title %}Projects{% endblock %}
{% block page_title %}Projects{% endblock %}

{% block content %}

<div class="section-head">
    <h2>Manage Projects</h2>
    <button class="btn btn-primary" onclick="openProjectModal()">
        <i class="fas fa-plus"></i> Add Project
    </button>
</div>

<div class="card">
    <div class="table-wrap">
        <table class="table">
            <thead>
                <tr><th>Title</th><th>Category</th><th>Tech</th><th>Featured</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="projectsBody">
                <tr><td colspan="6" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal-overlay" id="projectModal">
    <div class="modal" style="max-width: 600px;">
        <div class="modal-head">
            <h3 id="projectModalTitle">Add Project</h3>
            <button class="modal-close" onclick="closeProjectModal()"><i class="fas fa-times"></i></button>
        </div>
        <form onsubmit="return saveProject(event)">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Title *</label>
                    <input type="text" id="pTitle" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea id="pDesc" class="form-textarea"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Technologies (comma separated)</label>
                    <input type="text" id="pTech" class="form-input" placeholder="Python, Flask, Supabase">
                </div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <input type="text" id="pCategory" class="form-input" value="Machine Learning">
                </div>
                <div class="form-group">
                    <label class="form-label">Image URL (optional)</label>
                    <input type="text" id="pImage" class="form-input" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label class="form-label">GitHub URL</label>
                    <input type="text" id="pGithub" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Live URL</label>
                    <input type="text" id="pLive" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Display Order</label>
                    <input type="number" id="pOrder" class="form-input" value="0">
                </div>
                <label class="form-check" style="margin-bottom: 10px;">
                    <input type="checkbox" id="pFeatured"><span>Featured</span>
                </label>
                <label class="form-check">
                    <input type="checkbox" id="pActive" checked><span>Active</span>
                </label>
            </div>
            <div class="modal-foot">
                <button type="button" class="btn btn-ghost" onclick="closeProjectModal()">Cancel</button>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
const H = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('token')}` };
let allProjects = [];
let editId = null;

async function loadProjects() {
    const tbody = document.getElementById('projectsBody');
    try {
        const res = await fetch('/api/projects/all', { headers: H });
        const data = await res.json();
        allProjects = data.projects || [];
        if (allProjects.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><i class="fas fa-cube"></i><p>No projects yet</p></td></tr>';
            return;
        }
        tbody.innerHTML = allProjects.map(p => `
            <tr>
                <td>${esc(p.title)}</td>
                <td>${esc(p.category)}</td>
                <td>${esc((p.technologies || '').substring(0, 30))}...</td>
                <td>${p.is_featured ? '<span class="badge badge-warning">Yes</span>' : '—'}</td>
                <td><span class="badge ${p.is_active ? 'badge-success' : 'badge-danger'}">${p.is_active ? 'Active' : 'Inactive'}</span></td>
                <td>
                    <div class="actions">
                        <button class="btn-icon" onclick="editProject('${p.id}')"><i class="fas fa-pen"></i></button>
                        <button class="btn-icon danger" onclick="delProject('${p.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                </td>
            </tr>
        `).join('');
    } catch (e) { tbody.innerHTML = '<tr><td colspan="6">Failed</td></tr>'; }
}

function esc(t) { const d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; }

function openProjectModal() {
    editId = null;
    document.getElementById('projectModalTitle').textContent = 'Add Project';
    ['pTitle','pDesc','pTech','pImage','pGithub','pLive'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('pCategory').value = 'Machine Learning';
    document.getElementById('pOrder').value = 0;
    document.getElementById('pFeatured').checked = false;
    document.getElementById('pActive').checked = true;
    document.getElementById('projectModal').classList.add('open');
}

function closeProjectModal() { document.getElementById('projectModal').classList.remove('open'); }

async function saveProject(e) {
    e.preventDefault();
    const payload = {
        title: document.getElementById('pTitle').value,
        description: document.getElementById('pDesc').value,
        technologies: document.getElementById('pTech').value,
        category: document.getElementById('pCategory').value,
        image_url: document.getElementById('pImage').value,
        github_url: document.getElementById('pGithub').value,
        live_url: document.getElementById('pLive').value,
        display_order: parseInt(document.getElementById('pOrder').value),
        is_featured: document.getElementById('pFeatured').checked,
        is_active: document.getElementById('pActive').checked
    };
    const url = editId ? `/api/projects/${editId}` : '/api/projects';
    const method = editId ? 'PUT' : 'POST';
    await fetch(url, { method, headers: H, body: JSON.stringify(payload) });
    closeProjectModal();
    loadProjects();
    return false;
}

window.editProject = function(id) {
    const p = allProjects.find(x => x.id === id);
    if (!p) return;
    editId = id;
    document.getElementById('projectModalTitle').textContent = 'Edit Project';
    document.getElementById('pTitle').value = p.title;
    document.getElementById('pDesc').value = p.description || '';
    document.getElementById('pTech').value = p.technologies || '';
    document.getElementById('pCategory').value = p.category || '';
    document.getElementById('pImage').value = p.image_url || '';
    document.getElementById('pGithub').value = p.github_url || '';
    document.getElementById('pLive').value = p.live_url || '';
    document.getElementById('pOrder').value = p.display_order || 0;
    document.getElementById('pFeatured').checked = p.is_featured;
    document.getElementById('pActive').checked = p.is_active;
    document.getElementById('projectModal').classList.add('open');
};

window.delProject = async function(id) {
    if (!confirm('Delete this project?')) return;
    await fetch(`/api/projects/${id}`, { method: 'DELETE', headers: H });
    loadProjects();
};

loadProjects();
</script>
{% endblock %}
