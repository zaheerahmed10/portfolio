{% extends "admin/_base.html" %}
{% block title %}Profile{% endblock %}
{% block page_title %}Profile{% endblock %}

{% block content %}

<div class="card" style="max-width: 800px;">
    <div class="section-head">
        <h2>Edit Profile</h2>
    </div>
    <form onsubmit="return saveProfile(event)">
        <div class="form-group">
            <label class="form-label">Name</label>
            <input type="text" id="pName" class="form-input" required>
        </div>
        <div class="form-group">
            <label class="form-label">Title / Role</label>
            <input type="text" id="pTitle" class="form-input">
        </div>
        <div class="form-group">
            <label class="form-label">Bio (short)</label>
            <textarea id="pBio" class="form-textarea"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">About (long)</label>
            <textarea id="pAbout" class="form-textarea" style="min-height: 140px;"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" id="pEmail" class="form-input">
        </div>
        <div class="form-group">
            <label class="form-label">Phone</label>
            <input type="text" id="pPhone" class="form-input">
        </div>
        <div class="form-group">
            <label class="form-label">Location</label>
            <input type="text" id="pLocation" class="form-input">
        </div>
        <div class="form-group">
            <label class="form-label">GitHub URL</label>
            <input type="text" id="pGithub" class="form-input">
        </div>
        <div class="form-group">
            <label class="form-label">LinkedIn URL</label>
            <input type="text" id="pLinkedin" class="form-input">
        </div>
        <div class="form-group">
            <label class="form-label">Profile Image URL</label>
            <input type="text" id="pImage" class="form-input" placeholder="https://...">
        </div>
        <div class="form-group">
            <label class="form-label">Resume URL</label>
            <input type="text" id="pResume" class="form-input">
        </div>
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Profile</button>
    </form>
</div>

{% endblock %}

{% block scripts %}
<script>
const H = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('token')}` };

async function loadProfile() {
    const res = await fetch('/api/profile');
    const data = await res.json();
    const p = data.profile || {};
    const set = (id, v) => document.getElementById(id).value = v || '';
    set('pName', p.name); set('pTitle', p.title); set('pBio', p.bio); set('pAbout', p.about);
    set('pEmail', p.email); set('pPhone', p.phone); set('pLocation', p.location);
    set('pGithub', p.github_url); set('pLinkedin', p.linkedin_url);
    set('pImage', p.profile_image_url); set('pResume', p.resume_url);
}

async function saveProfile(e) {
    e.preventDefault();
    const payload = {
        name: document.getElementById('pName').value,
        title: document.getElementById('pTitle').value,
        bio: document.getElementById('pBio').value,
        about: document.getElementById('pAbout').value,
        email: document.getElementById('pEmail').value,
        phone: document.getElementById('pPhone').value,
        location: document.getElementById('pLocation').value,
        github_url: document.getElementById('pGithub').value,
        linkedin_url: document.getElementById('pLinkedin').value,
        profile_image_url: document.getElementById('pImage').value,
        resume_url: document.getElementById('pResume').value
    };
    const res = await fetch('/api/profile', { method: 'PUT', headers: H, body: JSON.stringify(payload) });
    const data = await res.json();
    alert(data.success ? '✅ Profile updated!' : '❌ ' + data.message);
    return false;
}

loadProfile();
</script>
{% endblock %}
