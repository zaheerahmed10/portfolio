{% extends "admin/_base.html" %}
{% block title %}Users{% endblock %}
{% block page_title %}Users{% endblock %}

{% block content %}

<div class="section-head">
    <h2>Manage Users</h2>
</div>

<div class="card">
    <div class="table-wrap">
        <table class="table">
            <thead>
                <tr><th>Name</th><th>Email</th><th>Role</th><th>Actions</th></tr>
            </thead>
            <tbody id="usersBody">
                <tr><td colspan="4" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
const H = { 'Authorization': `Bearer ${localStorage.getItem('token')}` };

async function loadUsers() {
    const tbody = document.getElementById('usersBody');
    try {
        const res = await fetch('/api/users', { headers: H });
        const data = await res.json();
        const users = data.users || [];
        if (users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty-state"><i class="fas fa-users"></i><p>No users</p></td></tr>';
            return;
        }
        tbody.innerHTML = users.map(u => `
            <tr>
                <td>${esc(u.name || '—')}</td>
                <td>${esc(u.email)}</td>
                <td><span class="badge ${u.role === 'admin' ? 'badge-warning' : 'badge-success'}">${(u.role || 'user').toUpperCase()}</span></td>
                <td>
                    ${u.role !== 'admin' ? `<button class="btn-icon danger" onclick="delUser('${u.id}')"><i class="fas fa-trash"></i></button>` : '<span style="color:var(--text-dim); font-size:0.8rem;">Protected</span>'}
                </td>
            </tr>
        `).join('');
    } catch (e) { tbody.innerHTML = '<tr><td colspan="4">Failed</td></tr>'; }
}

function esc(t) { const d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; }

window.delUser = async function(id) {
    if (!confirm('Delete this user?')) return;
    await fetch(`/api/users/${id}`, { method: 'DELETE', headers: H });
    loadUsers();
};

loadUsers();
</script>
{% endblock %}
