{% extends "admin/_base.html" %}
{% block title %}Skills{% endblock %}
{% block page_title %}Skills{% endblock %}

{% block content %}

<div class="section-head">
    <h2>Manage Skills</h2>
    <button class="btn btn-primary" onclick="openSkillModal()">
        <i class="fas fa-plus"></i> Add Skill
    </button>
</div>

<div class="card">
    <div class="table-wrap">
        <table class="table">
            <thead>
                <tr><th>Name</th><th>Category</th><th>Level</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="skillsBody">
                <tr><td colspan="5" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal-overlay" id="skillModal">
    <div class="modal">
        <div class="modal-head">
            <h3 id="skillModalTitle">Add Skill</h3>
            <button class="modal-close" onclick="closeSkillModal()"><i class="fas fa-times"></i></button>
        </div>
        <form onsubmit="return saveSkill(event)">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Skill Name *</label>
                    <input type="text" id="skillName" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select id="skillCategory" class="form-select">
                        <option>Programming Languages</option>
                        <option>Data Science</option>
                        <option>Mathematics for AI</option>
                        <option>Machine Learning</option>
                        <option>Deep Learning</option>
                        <option>Generative AI</option>
                        <option>Web Development</option>
                        <option>Databases</option>
                        <option>CS Fundamentals</option>
                        <option>Tools &amp; Platforms</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Level (0-100)</label>
                    <input type="number" id="skillLevel" class="form-input" min="0" max="100" value="80">
                </div>
                <div class="form-group">
                    <label class="form-label">Icon (Font Awesome class)</label>
                    <input type="text" id="skillIcon" class="form-input" value="fas fa-code">
                </div>
                <div class="form-group">
                    <label class="form-label">Display Order</label>
                    <input type="number" id="skillOrder" class="form-input" value="0">
                </div>
                <label class="form-check">
                    <input type="checkbox" id="skillActive" checked>
                    <span>Active</span>
                </label>
            </div>
            <div class="modal-foot">
                <button type="button" class="btn btn-ghost" onclick="closeSkillModal()">Cancel</button>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
const H = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('token')}` };
let allSkills = [];
let editId = null;

async function loadSkills() {
    const tbody = document.getElementById('skillsBody');
    try {
        const res = await fetch('/api/skills/all', { headers: H });
        const data = await res.json();
        allSkills = data.skills || [];
        if (allSkills.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-state"><i class="fas fa-code"></i><p>No skills yet</p></td></tr>';
            return;
        }
        tbody.innerHTML = allSkills.map(s => `
            <tr>
                <td>${esc(s.name)}</td>
                <td>${esc(s.category)}</td>
                <td>${s.level}%</td>
                <td><span class="badge ${s.is_active ? 'badge-success' : 'badge-danger'}">${s.is_active ? 'Active' : 'Inactive'}</span></td>
                <td>
                    <div class="actions">
                        <button class="btn-icon" onclick="editSkill('${s.id}')"><i class="fas fa-pen"></i></button>
                        <button class="btn-icon danger" onclick="delSkill('${s.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                </td>
            </tr>
        `).join('');
    } catch (e) { tbody.innerHTML = '<tr><td colspan="5">Failed</td></tr>'; }
}

function esc(t) { const d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; }

function openSkillModal() {
    editId = null;
    document.getElementById('skillModalTitle').textContent = 'Add Skill';
    document.getElementById('skillName').value = '';
    document.getElementById('skillCategory').value = 'Programming Languages';
    document.getElementById('skillLevel').value = 80;
    document.getElementById('skillIcon').value = 'fas fa-code';
    document.getElementById('skillOrder').value = 0;
    document.getElementById('skillActive').checked = true;
    document.getElementById('skillModal').classList.add('open');
}

function closeSkillModal() { document.getElementById('skillModal').classList.remove('open'); }

async function saveSkill(e) {
    e.preventDefault();
    const payload = {
        name: document.getElementById('skillName').value,
        category: document.getElementById('skillCategory').value,
        level: parseInt(document.getElementById('skillLevel').value),
        icon: document.getElementById('skillIcon').value,
        display_order: parseInt(document.getElementById('skillOrder').value),
        is_active: document.getElementById('skillActive').checked
    };
    const url = editId ? `/api/skills/${editId}` : '/api/skills';
    const method = editId ? 'PUT' : 'POST';
    await fetch(url, { method, headers: H, body: JSON.stringify(payload) });
    closeSkillModal();
    loadSkills();
    return false;
}

window.editSkill = function(id) {
    const s = allSkills.find(x => x.id === id);
    if (!s) return;
    editId = id;
    document.getElementById('skillModalTitle').textContent = 'Edit Skill';
    document.getElementById('skillName').value = s.name;
    document.getElementById('skillCategory').value = s.category;
    document.getElementById('skillLevel').value = s.level;
    document.getElementById('skillIcon').value = s.icon;
    document.getElementById('skillOrder').value = s.display_order || 0;
    document.getElementById('skillActive').checked = s.is_active;
    document.getElementById('skillModal').classList.add('open');
};

window.delSkill = async function(id) {
    if (!confirm('Delete this skill?')) return;
    await fetch(`/api/skills/${id}`, { method: 'DELETE', headers: H });
    loadSkills();
};

loadSkills();
</script>
{% endblock %}
