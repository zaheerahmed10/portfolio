{% extends "admin/_base.html" %}
{% block title %}Messages{% endblock %}
{% block page_title %}Messages{% endblock %}

{% block content %}

<div class="section-head">
    <h2>Contact Messages</h2>
</div>

<div id="messagesList">
    <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
</div>

{% endblock %}

{% block scripts %}
<script>
const H = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('token')}` };

async function loadMessages() {
    const box = document.getElementById('messagesList');
    try {
        const res = await fetch('/api/messages', { headers: H });
        const data = await res.json();
        const messages = data.messages || [];
        if (messages.length === 0) {
            box.innerHTML = '<div class="card"><div class="empty-state"><i class="fas fa-inbox"></i><p>No messages yet</p></div></div>';
            return;
        }
        box.innerHTML = messages.map(m => `
            <div class="card" style="margin-bottom: 12px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 12px; gap: 12px;">
                    <div>
                        <div style="font-weight: 600;">${esc(m.name)}</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">${esc(m.email)}</div>
                    </div>
                    <div style="font-size: 0.75rem; color: var(--text-dim);">${new Date(m.created_at).toLocaleString()}</div>
                </div>
                <div style="font-weight: 600; margin-bottom: 8px;">${esc(m.subject || 'No subject')}</div>
                <div style="color: var(--text-muted); font-size: 0.9rem; line-height: 1.6;">${esc(m.message)}</div>
                <div style="margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);">
                    <button class="btn-icon danger" onclick="delMsg('${m.id}')"><i class="fas fa-trash"></i> Delete</button>
                </div>
            </div>
        `).join('');
    } catch (e) { box.innerHTML = '<div class="card">Failed to load</div>'; }
}

function esc(t) { const d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; }

window.delMsg = async function(id) {
    if (!confirm('Delete this message?')) return;
    await fetch(`/api/messages/${id}`, { method: 'DELETE', headers: H });
    loadMessages();
};

loadMessages();
</script>
{% endblock %}
